# Блок «Рассылка счетов» — единица данных (rules/data.md#yaml); читать: tools/doc unit billing/mailer
title: Рассылка счетов
kind: сервис
does: [отправляет выставленный счёт клиенту, помечает счёт «не отправлен» или «нет адреса»]
tech: Python 3.12, очередь задач планировщика
stories: [US-BIL-1]
io:
- {dir: ←, with: планировщик, what: ID счёта}
- {dir: →, with: почтовый сервис, what: письмо со счётом, via: [I1]}
data:
- {table: invoices, access: read-write, why: статус отправки пишется в счёт}
params:
- {name: mail.retries, value: 3}
reqs: [R-BIL-2]
tasks: ['1.1']
on_failure: почтовый сервис недоступен → mail.retries повторов, затем «не отправлен»
why: повтор безопасен — отправка идемпотентна по ID счёта (I1)
operations: [send_invoice(id) — планировщик — I1]
