# Пример настройки doctool для минимального проекта (см. tools/README.md).
# Правила берутся из methodology/rules этого же репозитория; в своём проекте — rules_dir = "rules".
plugins = ["tools/doc_plugins"]
builtin_plugins = ["datamodel"]

[project]
name = "Минимальный пример"
command = "python ../../tools/doc"
rules_dir = "../../rules"
work_dir = ".doctool"

[[generated]]
glob = ["approvals.md", "approvals-summary.md", "specs/*/approvals.md"]
by = "tools/doc check / approve"
source = "решения ролей — tools/doc approve"
commit = true

[[generated]]
glob = "TASKS.md"
by = "tools/doc tasks-table (плагин tools/doc_plugins/house.py)"
source = "tasks/*.md"
commit = true

[[generated]]
glob = "token-costs.md"
by = "tools/doc cost md (и cost add)"
source = "data/costs.yaml — tools/doc cost add …"
commit = true

[[generated]]
glob = "site/**"
by = "сборка сайта"
source = "исходники *.md"
commit = false

[[types]]
name = "Главная / архитектура"
glob = "architecture.md"
approve = "АВ"

[[types]]
name = "Spec"
glob = "specs/*/spec.md"
approve = ""
sections = ["## Purpose"]

[[types]]
name = "Параметры и интерфейсы спеки"
glob = "specs/*/interfaces.md"

[[types]]
name = "Открытые вопросы спеки"
glob = "specs/*/open-questions.md"

[[types]]
name = "Страница блока"
glob = "components/*/blocks/*.md"
approve = "АРТ"
approve_as = "Блок"

[[types]]
name = "Блок (YAML)"
glob = "data/blocks/*/*.yaml"
exclude = "data/blocks/*/_order.yaml"
approve = "АРТ"
methodology = "blocks.md"
card = "unit"

[[types]]
name = "Трассировка (RTM)"
glob = "specs/*/traceability.md"

[[types]]
name = "Deploy"
glob = "deploy/*.md"
approve_as = "Deploy"
sections = ["## Образы", "## Запуск", "## Переменные и секреты", "## Сборка и поставка", "## Проверка после развёртывания"]
recommended = ["## Обновление и откат"]

[[types]]
name = "Задача"
glob = "tasks/*.md"
sections = ["## Закрывает требования", "## Зачем", "## Приёмка", "## Декомпозиция"]

[[types]]
name = "Roadmap / сводная таблица / бэклог"
glob = ["ROADMAP.md", "TASKS.md"]

[[types]]
name = "R&D"
glob = "rnd/*.md"
exclude = "rnd/README.md"

[[types]]
name = "Решения"
glob = "design.md"

[[types]]
name = "Замечания компонента"
glob = "reviews/findings/*.md"

[approvals]
registry = "approvals.md"
summary = "approvals-summary.md"
lock_timeout = 10

[requirements]
specs = ["specs/*/spec.md"]
id = 'R-[A-Z]+-\d+'
min_scenarios = 3

[requirements.approvals]
enabled = true
default = "ИТ"

[tasks]
glob = ["tasks/*.md"]
roadmap = "ROADMAP.md"
roadmap_hours_col = 4

[components]
source = "data/components.json"
key = "components"
from_path = ["(?:^|/)(?:deploy|reviews/findings)/(?P<c>[^/.]+)", "(?:^|/)(?:components|specs)/(?P<c>[^/]+)/"]

[findings]
dir = "reviews/findings"
id = "Z-{code}-{n}"

[blocks]
data_kind = "block"
data_map = { "Что делает" = "does", "Технология" = "tech", "Истории" = "stories", "Входы и выходы" = "io", "Данные" = "data", "Параметры" = "params", "Требования" = "reqs", "Задачи" = "tasks", "При сбое" = "on_failure", "Почему так" = "why" }
data_sections = { "сервис" = "operations", "интерфейс" = "screens", "хранилище" = "schema" }
glob = ["components/*/blocks/*.md"]
fields = [
  { name = "Что делает", required = true },
  { name = "Технология", required = true },
  { name = "Истории", required = false, refs = ["story"] },
  { name = "Входы и выходы", required = true, refs = ["interface"] },
  { name = "Данные", required = true, refs = ["table"] },
  { name = "Параметры", required = true, refs = ["param"] },
  { name = "Требования", required = true, refs = ["requirement"] },
  { name = "Задачи", required = true, refs = ["task"] },
  { name = "При сбое", required = true },
  { name = "Почему так", required = true, refs = ["decision"] },
]


# Данные в YAML по единице (rules/data.md#yaml): один файл — одна единица; схема вида — здесь.
[data]
schema_dir = "data/_schema"        # yaml-schema: JSON Schema для редактора (и yaml.schemas в .vscode/settings.json)

[data.params]                      # тип значения параметра — из таблицы параметров спеки
glob = "specs/*/interfaces.md"
name_col = "Параметр"
default_col = "По умолчанию"
min_col = "Мин"
max_col = "Макс"

# Каталоги значений для ref: откуда собирать ID (виды единиц, поля единиц, регулярки по файлам, перечисление).
[[data.catalogs]]
name = "participant"
about = "блок (название) или участник обмена из interfaces.md спек"
fields = [{ kind = "block", field = "title" }]
values = ["планировщик"]
files = [{ glob = "specs/*/interfaces.md", pattern = '→ ([^|]+?)\s*\|' }]

[[data.kinds]]
name = "block"
glob = "data/blocks/*/*.yaml"
id = "{parent}/{stem}"
title = "title"
component = "{parent}"
regen = "схема компонента {parent} и страница блока «{stem}» (сборка сайта)"
fields = [
  { name = "title", type = "str", required = true },
  { name = "kind", type = "str", required = true, choices = ["интерфейс", "сервис", "хранилище"] },
  { name = "does", type = "list", items = "str", required = true },
  { name = "tech", type = "str", required = true },
  { name = "stories", type = "list", items = "str", ref = "story" },
  # Строки таблиц — словари с именованными полями; прежний вид [a, b, c] переводит yaml-migrate (positional).
  { name = "io", type = "list", required = true, positional = ["dir", "with", "what"], items = { type = "dict", one_of = ["with", "label"], fields = [
    { name = "dir", type = "str", required = true, choices = ["→", "←", "↔"] },
    { name = "with", type = "str", ref = "participant", desc = "с кем обмен: блок или участник из каталога" },
    { name = "label", type = "str", desc = "участник не из каталога — словами" },
    { name = "what", type = "str" },
    { name = "via", type = "list", items = "str", ref = "interface" },
  ] } },
  # «нет: <почему>» — допустимо вместо списка (блок без таблиц / без настроек)
  { name = "data", type = "list", none_ok = true, positional = ["table", "access"], items = { type = "dict", fields = [
    { name = "table", type = "str", required = true, ref = "table" },
    { name = "access", type = "str", choices = ["read", "write", "read-write"] },
    { name = "why", type = "str" },
  ] } },
  { name = "params", type = "list", none_ok = true, positional = ["name", "value"], items = { type = "dict", fields = [
    { name = "name", type = "str", required = true, ref = "param" },
    { name = "value", type = "any", param_value = "name", desc = "значение по типу параметра из таблицы спеки" },
    { name = "note", type = "str", desc = "пояснение вместо значения" },
  ] } },
  { name = "reqs", type = "list", items = "str", ref = "requirement", required = true },
  { name = "tasks", type = "list", items = "str", ref = "task", required = true },
  { name = "on_failure", type = "str", required = true },
  { name = "why", type = "str", required = true },
  { name = "operations", type = "list", items = "str" },
  { name = "screens", type = "list", items = "str" },
  { name = "schema", type = "list", items = "str" },
]

[[data.kinds]]
name = "model"
glob = "data/models/*.yaml"
id_pattern = '[A-Z][A-Za-z]+'
title = "name"
regen = "контракт {stem} на вкладке «Интеграции»"
fields = [
  { name = "name", type = "str", required = true },
  { name = "owner", type = "str", required = true },
  { name = "source", type = "str", required = true, choices = ["✅ есть", "📘 внешний протокол", "🧩 наше решение"] },
  { name = "why", type = "str", required = true },
  { name = "interfaces", type = "list", items = "str", ref = "interface" },
  { name = "fields", type = "list", required = true, items = { type = "dict", fields = [
    { name = "name", type = "str", required = true },
    { name = "type", type = "str", required = true },
    { name = "required", type = "bool", required = true },
    { name = "desc", type = "str", required = true },
  ] } },
]

[[data.kinds]]
name = "story"
glob = "data/stories/*/*.yaml"
id_pattern = 'US-[A-Z]+-\d+'
id_hint = "US-<КОД>-<N>"
component = "{parent}"
regen = "истории компонента {parent} (страница историй)"
fields = [
  { name = "role", type = "str", required = true },
  { name = "want", type = "str", required = true },
  { name = "so_that", type = "str", required = true },
  { name = "reqs", type = "list", items = "str", ref = "requirement", required = true },
  { name = "accept", type = "list", items = "str", required = true },
]

# Учёт расхода токенов (rules/token-costs.md): журнал и генерируемая страница.
[costs]
file = "data/costs.yaml"
page = "token-costs.md"
titles = { review-batch = "Пакетная проверка ролями", unit-read = "Чтение единицы данных" }

[ids.param]
pattern = '`([a-z][\w.]*)`'
defined_in = ["specs/*/interfaces.md"]
define = '^\|\s*`([^`]+)`\s*\|'

[ids.decision]
pattern = '\bD-\d+\b'
defined_in = ["design.md"]
define = '^#{2,4}\s+(D-\d+)\b'
check_refs = true
refs_in = ["**/*.md"]

[graph]
edges = [
  ["Инструменты", "Спека", "выжимка route и проверки по новым правилам"],
  ["Решения", "Архитектура", "нет текста, противоречащего решению"],
  ["Архитектура", "Спека", "границы и названия"],
  ["Спека", "Параметры и интерфейсы", "конфигурация, интерфейсы, FMEA"],
  ["Спека", "Задачи", "приёмка, ссылка на требование"],
  ["Спека", "Блоки", "требования в карточке"],
  ["Параметры и интерфейсы", "Модель данных", "I-коды и таблицы"],
  ["Параметры и интерфейсы", "Deploy", "значения в примере конфигурации"],
  ["Задачи", "Сводки", "строка и итоги"],
  ["Данные (YAML)", "Спека", "требования и сценарии по ссылкам единицы"],
  ["Данные (YAML)", "Блоки", "страница блока и схема компонента"],
]

[graph.nodes]
"Инструменты" = ["doc.config.toml", "tools/doc_plugins/*.py"]
"Решения" = ["design.md"]
"Архитектура" = ["architecture.md"]
"Спека" = ["specs/*/spec.md"]
"Параметры и интерфейсы" = ["specs/*/interfaces.md"]
"Модель данных" = ["data/model.json"]
"Данные (YAML)" = ["data/blocks/*/*.yaml", "data/models/*.yaml", "data/stories/*/*.yaml"]
"Блоки" = ["components/*/blocks/*.md"]
"Deploy" = ["deploy/*.md"]
"Задачи" = ["tasks/*.md"]
"Сводки" = ["ROADMAP.md", "TASKS.md"]

[lint]
enable = ["subtasks", "requirement-scenarios", "block-card", "block-screens", "recommended-sections", "task-acceptance", "placeholders",
          "task-acceptance-coverage", "task-estimate-range", "open-question-refs", "fmea-scenarios", "rtm", "block-refs", "deploy-migrations"]

[check]
entries = ["README.md"]

[rnd]
dir = "rnd"
template = "../../templates/rnd.md"
index = "rnd/README.md"
index_row = "| [{title}]({file}) | {title} | черновик | v3.2 |"

[plugin.datamodel]
file = "data/model.json"
interfaces_in = ["specs/*/interfaces.md"]

[plugin.house]
api_pages = ["specs/*/interfaces.md"]     # где перечислены эндпоинты (lint screen-endpoints)
config_stores = ["values"]                # хранилище параметра, которое требует «Пример конфигурации» в Deploy
